type: object
required:
  - character_id
  - name
  - role
  - identity
properties:
  character_id:
    type: string
  name:
    type: string
  role:
    type: string
  identity:
    type: object
    required:
      - age
      - appearance
    properties:
      age:
        type: string
      appearance:
        type: string
      face:
        type: string
      hair:
        type: string
      eyes:
        type: string
      body:
        type: string
      wardrobe:
        type: string
      accessories:
        type: array
        items:
          type: string
  personality:
    type: string
  voice:
    type: string
