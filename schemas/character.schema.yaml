anyOf:
  - type: object
    required:
      - character_id
      - name
      - role
      - identity
    properties:
      character_id:
        type: string
      name:
        type: string
      role:
        type: string
      identity:
        type: object
        required:
          - age
          - appearance
        properties:
          age:
            type: string
          appearance:
            type: string
          face:
            type: string
          hair:
            type: string
          eyes:
            type: string
          body:
            type: string
          wardrobe:
            type: string
          accessories:
            anyOf:
              - type: string
              - type: array
                items:
                  type: string
      personality:
        type: string
      voice:
        type: string
  - type: array
    items:
      type: object
      required:
        - character_id
        - name
        - role
        - identity
      properties:
        character_id:
          type: string
        name:
          type: string
        role:
          type: string
        identity:
          type: object
          required:
            - age
            - appearance
          properties:
            age:
              type: string
            appearance:
              type: string
            face:
              type: string
            hair:
              type: string
            eyes:
              type: string
            body:
              type: string
            wardrobe:
              type: string
            accessories:
              anyOf:
                - type: string
                - type: array
                  items:
                    type: string
        personality:
          type: string
        voice:
          type: string
  - type: object
    required:
      - characters
    properties:
      characters:
        type: array
        items:
          type: object
          required:
            - character_id
            - name
            - role
            - identity
          properties:
            character_id:
              type: string
            name:
              type: string
            role:
              type: string
            identity:
              type: object
              required:
                - age
                - appearance
              properties:
                age:
                  type: string
                appearance:
                  type: string
                face:
                  type: string
                hair:
                  type: string
                eyes:
                  type: string
                body:
                  type: string
                wardrobe:
                  type: string
                accessories:
                  anyOf:
                    - type: string
                    - type: array
                      items:
                        type: string
            personality:
              type: string
            voice:
              type: string
