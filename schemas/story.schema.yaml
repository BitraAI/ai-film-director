type: object
required:
  - story_id
  - title
  - logline
  - premise
  - acts
properties:
  story_id:
    type: string
  title:
    type: string
  logline:
    type: string
  premise:
    type: string
  genre:
    type: string
    enum:
      - "Action"
      - "Comedy"
      - "Drama"
      - "Horror"
      - "Sci-Fi"
      - "Documentary"
      - "Romance"
      - "Thriller"
      - "Family"
      - "Animation"
      - "Adventure"
      - "Fantasy"
      - "Historical"
      - "Musical"
  subgenres:
    type: array
    items:
      type: string
      enum:
        - "Action Adventure"
        - "Action Comedy"
        - "Action Thriller"
        - "Comedy Drama"
        - "Sci-Fi Adventure"
        - "Sci-Fi Comedy"
        - "Sci-Fi Horror"
        - "Historical Drama"
        - "Historical Epic"
        - "Historical Fiction"
        - "Film Noir"
        - "Coming of Age"
        - "3D Animation"
        - "Space Opera"
    uniqueItems: true
    default: []
  tone:
    type: string
  theme:
    type: string
  characters:
    type: array
    items:
      type: string
  acts:
    type: array
    items:
      type: object
      required:
        - act_id
        - title
        - beats
      properties:
        act_id:
          type: string
        title:
          type: string
        beats:
          type: array
          items:
            type: object
            required:
              - beat_id
              - description
            properties:
              beat_id:
                type: string
              description:
                type: string
