type: object
required:
  - project_id
  - title
  - genre
  - aspect_ratio
  - fps
properties:
  project_id:
    type: string
  title:
    type: string
  genre:
    type: string
    enum:
      - "Action"
      - "Comedy"
      - "Drama"
      - "Horror"
      - "Sci-Fi"
      - "Documentary"
      - "Romance"
      - "Thriller"
      - "Family"
      - "Animation"
      - "Adventure"
      - "Fantasy"
      - "Historical"
      - "Musical"
  subgenres:
    type: array
    items:
      type: string
      enum:
        - "Action Adventure"
        - "Action Comedy"
        - "Action Thriller"
        - "Comedy Drama"
        - "Sci-Fi Adventure"
        - "Sci-Fi Comedy"
        - "Sci-Fi Horror"
        - "Historical Drama"
        - "Historical Epic"
        - "Historical Fiction"
        - "Film Noir"
        - "Coming of Age"
        - "3D Animation"
        - "Space Opera"
    uniqueItems: true
    default: []
  fps:
    type: number
  duration_seconds:
    type: number
