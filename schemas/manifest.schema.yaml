type: object
required:
  - project_id
  - stages
properties:
  project_id:
    type: string
  stages:
    type: object
    properties:
      story:
        type: boolean
      screenplay:
        type: boolean
      characters:
        type: boolean
      locations:
        type: boolean
      props:
        type: boolean
      storyboard:
        type: boolean
      shots:
        type: boolean
      image_prompts:
        type: boolean
      video_prompts:
        type: boolean
      audio_prompts:
        type: boolean
      final:
        type: boolean
